<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>دوربین خانه</title>

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #111;
            color: white;
            margin: 0;
            padding: 20px;
        }

        h2 {
            margin-bottom: 20px;
        }

        video {
            width: 100%;
            max-width: 800px;
            background: #000;
            border-radius: 12px;
        }

        #status {
            margin-top: 15px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h2>📷 دوربین خانه</h2>

    <video
        id="video"
        autoplay
        playsinline
        muted>
    </video>

    <p id="status">در حال آماده‌سازی...</p>

    <script>

        // ==========================================
        // تنظیمات
        // ==========================================

        const params = new URLSearchParams(window.location.search);

        // اگر ?mode=view باشد → حالت بیننده
        const isViewer = params.get("mode") === "view";

        // شناسه دوربین
        // این مقدار را بین دو دستگاه مشترک نگه دار
        const CAMERA_ID = "ali-home-camera-739284-x91";


        // ==========================================
        // عناصر صفحه
        // ==========================================

        const video = document.getElementById("video");
        const status = document.getElementById("status");


        // ==========================================
        // ساخت Peer
        // ==========================================

        const peer = new Peer(
            isViewer
                ? "viewer-" + Math.random().toString(36).substring(2, 10)
                : CAMERA_ID
        );


        // ==========================================
        // Peer آماده شد
        // ==========================================

        peer.on("open", function () {

            console.log("Peer ID:", peer.id);

            if (isViewer) {

                startViewer();

            } else {

                startCamera();

            }

        });


        // ==========================================
        // حالت دوربین
        // ==========================================

        function startCamera() {

            status.textContent =
                "📷 در حال درخواست اجازه دوربین...";

            navigator.mediaDevices.getUserMedia({

                video: true,
                audio: true

            })

            .then(function (stream) {

                // نمایش دوربین روی خود سیستم
                video.srcObject = stream;

                status.textContent =
                    "🟢 دوربین فعال است و منتظر اتصال می‌باشد.";

                console.log("Camera is ready.");

                // ======================================
                // دریافت تماس از بیننده
                // ======================================

                peer.on("call", function (call) {

                    console.log(
                        "Viewer connected:",
                        call.peer
                    );

                    status.textContent =
                        "🟢 یک بیننده متصل شد.";

                    // ارسال تصویر و صدا
                    call.answer(stream);

                });

            })

            .catch(function (error) {

                console.error(error);

                status.textContent =
                    "❌ اجازه دسترسی به دوربین داده نشد.";

            });

        }


        // ==========================================
        // حالت بیننده
        // ==========================================

        function startViewer() {

            status.textContent =
                "📡 در حال اتصال به دوربین...";

            console.log(
                "Connecting to:",
                CAMERA_ID
            );

            // درخواست اتصال تصویری
            const call = peer.call(CAMERA_ID, null);


            // ======================================
            // دریافت تصویر
            // ======================================

            call.on("stream", function (stream) {

                console.log("Camera stream received.");

                video.srcObject = stream;

                status.textContent =
                    "🟢 دوربین متصل شد.";

            });


            // ======================================
            // قطع اتصال
            // ======================================

            call.on("close", function () {

                status.textContent =
                    "🔴 اتصال به دوربین قطع شد.";

            });


            // ======================================
            // خطای تماس
            // ======================================

            call.on("error", function (error) {

                console.error(
                    "Call error:",
                    error
                );

                status.textContent =
                    "❌ خطا در دریافت تصویر.";

            });

        }


        // ==========================================
        // خطاهای PeerJS
        // ==========================================

        peer.on("error", function (error) {

            console.error(
                "PeerJS Error:",
                error
            );

            if (error.type === "unavailable-id") {

                status.textContent =
                    "❌ شناسه دوربین در حال استفاده است.";

            }

            else if (error.type === "peer-unavailable") {

                status.textContent =
                    "❌ دوربین پیدا نشد یا آنلاین نیست.";

            }

            else {

                status.textContent =
                    "❌ خطای اتصال: " + error.type;

            }

        });


        // ==========================================
        // اتصال Peer قطع شد
        // ==========================================

        peer.on("disconnected", function () {

            console.log("Peer disconnected.");

            status.textContent =
                "🟠 اتصال سرویس قطع شد.";

        });

    </script>

</body>
</html>
