<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>دوربین خانه</title>

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        video {
            width: 100%;
            max-width: 800px;
            background: black;
            border-radius: 12px;
        }

        button {
            margin-top: 20px;
            padding: 14px 25px;
            font-size: 18px;
            border: 0;
            border-radius: 10px;
            cursor: pointer;
        }

        #status {
            font-size: 18px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <h2>📷 دوربین خانه</h2>

    <video id="video" autoplay playsinline muted></video>

    <p id="status">در حال آماده‌سازی...</p>

    <button id="connectBtn" style="display:none;">
        📡 اتصال به دوربین
    </button>

<script>

const params = new URLSearchParams(window.location.search);
const isViewer = params.get("mode") === "view";

const CAMERA_ID = "ali-home-camera-739284-x91";

const video = document.getElementById("video");
const status = document.getElementById("status");
const connectBtn = document.getElementById("connectBtn");


/* ==============================
   تنظیم WebRTC
============================== */

const peerConfig = {
    debug: 2,

    config: {
        iceServers: [
            {
                urls: "stun:stun.l.google.com:19302"
            },
            {
                urls: "stun:stun1.l.google.com:19302"
            }
        ]
    }
};


/* ==============================
   ساخت Peer
============================== */

let peer;

if (isViewer) {

    peer = new Peer(
        "viewer-" +
        Math.random()
            .toString(36)
            .substring(2, 12),
        peerConfig
    );

} else {

    peer = new Peer(
        CAMERA_ID,
        peerConfig
    );
}


/* ==============================
   متغیر دوربین
============================== */

let cameraStream = null;
let pendingCalls = [];


/* ==============================
   Peer آماده شد
============================== */

peer.on("open", function(id) {

    console.log("Peer آماده شد:", id);

    if (isViewer) {

        status.textContent =
            "🟢 آماده اتصال";

        connectBtn.style.display = "inline-block";

    } else {

        startCamera();

    }

});


/* ==============================
   دریافت تماس
   خیلی مهم:
   این قسمت بیرون startCamera است
============================== */

peer.on("call", function(call) {

    console.log(
        "📞 تماس دریافت شد:",
        call.peer
    );

    if (cameraStream) {

        console.log(
            "📷 ارسال تصویر دوربین"
        );

        call.answer(cameraStream);

        status.textContent =
            "🟢 بیننده متصل شد.";

    } else {

        console.log(
            "⏳ دوربین هنوز آماده نیست."
        );

        pendingCalls.push(call);

        status.textContent =
            "⏳ در حال آماده‌سازی دوربین...";
    }

});


/* ==============================
   حالت دوربین
============================== */

function startCamera() {

    status.textContent =
        "📷 در حال درخواست دسترسی به دوربین...";

    navigator.mediaDevices.getUserMedia({

        video: true,
        audio: true

    })

    .then(function(stream) {

        cameraStream = stream;

        video.srcObject = stream;

        status.textContent =
            "🟢 دوربین آماده اتصال است.";

        console.log(
            "Camera ready:",
            peer.id
        );


        /* تماس‌هایی که زودتر رسیده بودند */

        pendingCalls.forEach(function(call) {

            console.log(
                "📤 پاسخ به تماس منتظر"
            );

            call.answer(cameraStream);

        });

        pendingCalls = [];

    })

    .catch(function(error) {

        console.error(
            "Camera error:",
            error
        );

        status.textContent =
            "❌ دسترسی به دوربین داده نشد.";

    });

}


/* ==============================
   ساخت جریان آزمایشی بیننده
============================== */

function createViewerStream() {

    const canvas =
        document.createElement("canvas");

    canvas.width = 2;
    canvas.height = 2;

    const ctx =
        canvas.getContext("2d");

    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, 2, 2);

    if (!canvas.captureStream) {

        throw new Error(
            "captureStream پشتیبانی نمی‌شود"
        );

    }

    return canvas.captureStream(5);
}


/* ==============================
   اتصال بیننده
============================== */

function connectToCamera() {

    status.textContent =
        "📡 در حال اتصال به دوربین...";

    connectBtn.style.display = "none";

    console.log(
        "📡 اتصال به:",
        CAMERA_ID
    );


    let viewerStream;

    try {

        viewerStream =
            createViewerStream();

    } catch (error) {

        console.error(
            error
        );

        status.textContent =
            "❌ مرورگر از اتصال پشتیبانی نمی‌کند.";

        connectBtn.style.display =
            "inline-block";

        return;
    }


    const call =
        peer.call(
            CAMERA_ID,
            viewerStream
        );


    if (!call) {

        status.textContent =
            "❌ تماس ساخته نشد.";

        connectBtn.style.display =
            "inline-block";

        return;
    }


    /* دریافت تصویر */

    call.on("stream", function(remoteStream) {

        console.log(
            "🎥 تصویر دوربین دریافت شد"
        );

        video.srcObject =
            remoteStream;

        status.textContent =
            "🟢 دوربین متصل شد!";

        video.play().catch(function() {

            console.log(
                "برای پخش تصویر روی صفحه ضربه بزنید."
            );

        });

    });


    /* اتصال قطع شد */

    call.on("close", function() {

        console.log(
            "اتصال قطع شد"
        );

        status.textContent =
            "🔴 اتصال قطع شد.";

        connectBtn.style.display =
            "inline-block";

    });


    /* خطای تماس */

    call.on("error", function(error) {

        console.error(
            "Call error:",
            error
        );

        status.textContent =
            "❌ خطا در اتصال.";

        connectBtn.style.display =
            "inline-block";

    });

}


/* ==============================
   دکمه اتصال
============================== */

connectBtn.addEventListener(
    "click",
    connectToCamera
);


/* ==============================
   خطاهای PeerJS
============================== */

peer.on("error", function(error) {

    console.error(
        "PeerJS Error:",
        error
    );

    if (error.type === "unavailable-id") {

        status.textContent =
            "❌ این دوربین قبلاً باز است.";

    }

    else if (error.type === "peer-unavailable") {

        status.textContent =
            "❌ کامپیوتر دوربین پیدا نشد.";

    }

    else if (error.type === "network") {

        status.textContent =
            "❌ مشکل شبکه.";

    }

    else {

        status.textContent =
            "❌ خطا: " + error.type;

    }

});


/* ==============================
   قطع Peer
============================== */

peer.on("disconnected", function() {

    console.log(
        "Peer disconnected"
    );

    status.textContent =
        "🟠 اتصال به سرویس قطع شد.";

});

</script>

</body>
</html>
