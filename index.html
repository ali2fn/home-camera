<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>دوربین خانه</title>

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        video {
            width: 100%;
            max-width: 800px;
            background: black;
            border-radius: 12px;
        }

        #status {
            font-size: 18px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <h2>📷 دوربین خانه</h2>

    <video
        id="video"
        autoplay
        playsinline
        muted>
    </video>

    <p id="status">در حال آماده‌سازی...</p>


<script>

    // ==========================================
    // تنظیمات
    // ==========================================

    const params = new URLSearchParams(window.location.search);

    const isViewer = params.get("mode") === "view";

    // شناسه ثابت کامپیوتر دوربین
    const CAMERA_ID = "ali-home-camera-739284-x91";


    // ==========================================
    // عناصر صفحه
    // ==========================================

    const video = document.getElementById("video");
    const status = document.getElementById("status");


    // ==========================================
    // تنظیمات اتصال WebRTC
    // ==========================================

    const peerConfig = {
        config: {
            iceServers: [
                {
                    urls: "stun:stun.l.google.com:19302"
                },
                {
                    urls: "stun:stun1.l.google.com:19302"
                }
            ]
        }
    };


    // ==========================================
    // ساخت Peer
    // ==========================================

    let peer;

    if (isViewer) {

        // موبایل فقط بیننده است
        peer = new Peer(
            "viewer-" +
            Math.random()
                .toString(36)
                .substring(2, 12),
            peerConfig
        );

    } else {

        // کامپیوتر دوربین
        peer = new Peer(
            CAMERA_ID,
            peerConfig
        );
    }


    // ==========================================
    // Peer آماده شد
    // ==========================================

    peer.on("open", function (id) {

        console.log("Peer connected:", id);

        if (isViewer) {

            startViewer();

        } else {

            startCamera();

        }

    });


    // ==========================================
    // حالت دوربین
    // ==========================================

    function startCamera() {

        status.textContent =
            "📷 در حال درخواست دسترسی به دوربین...";


        navigator.mediaDevices.getUserMedia({

            video: true,
            audio: true

        })

        .then(function (stream) {

            // نمایش تصویر روی کامپیوتر دوربین
            video.srcObject = stream;

            status.textContent =
                "🟢 دوربین آماده اتصال است.";

            console.log(
                "Camera ready:",
                peer.id
            );


            // ======================================
            // دریافت درخواست بیننده
            // ======================================

            peer.on("call", function (call) {

                console.log(
                    "Viewer connected:",
                    call.peer
                );

                status.textContent =
                    "🟢 بیننده متصل شد.";

                // ارسال دوربین
                call.answer(stream);

            });

        })

        .catch(function (error) {

            console.error(
                "Camera error:",
                error
            );

            status.textContent =
                "❌ دسترسی به دوربین داده نشد.";

        });

    }


    // ==========================================
    // ساخت MediaStream آزمایشی برای بیننده
    // ==========================================

    function createViewerStream() {

        const canvas =
            document.createElement("canvas");

        canvas.width = 2;
        canvas.height = 2;

        const ctx =
            canvas.getContext("2d");

        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, 2, 2);

        // ساخت یک VideoTrack داخلی
        const stream =
            canvas.captureStream(5);

        return stream;
    }


    // ==========================================
    // حالت بیننده
    // ==========================================

    function startViewer() {

        status.textContent =
            "📡 در حال اتصال به دوربین...";


        console.log(
            "Trying to connect to:",
            CAMERA_ID
        );


        // ساخت جریان کوچک داخلی
        // موبایل نیازی به دوربین خودش ندارد
        let viewerStream;

        try {

            viewerStream =
                createViewerStream();

        } catch (error) {

            console.error(
                "Viewer stream error:",
                error
            );

            status.textContent =
                "❌ مرورگر موبایل از این اتصال پشتیبانی نمی‌کند.";

            return;
        }


        // ======================================
        // برقراری تماس
        // ======================================

        const call =
            peer.call(
                CAMERA_ID,
                viewerStream
            );


        // ======================================
        // دریافت تصویر دوربین
        // ======================================

        call.on("stream", function (remoteStream) {

            console.log(
                "Camera stream received."
            );

            video.srcObject =
                remoteStream;

            status.textContent =
                "🟢 دوربین متصل شد!";

        });


        // ======================================
        // اتصال قطع شد
        // ======================================

        call.on("close", function () {

            status.textContent =
                "🔴 اتصال قطع شد.";

        });


        // ======================================
        // خطای تماس
        // ======================================

        call.on("error", function (error) {

            console.error(
                "Call error:",
                error
            );

            status.textContent =
                "❌ خطا در اتصال به دوربین.";

        });

    }


    // ==========================================
    // خطاهای PeerJS
    // ==========================================

    peer.on("error", function (error) {

        console.error(
            "PeerJS Error:",
            error
        );


        if (error.type === "unavailable-id") {

            status.textContent =
                "❌ شناسه دوربین قبلاً استفاده شده است.";

        }

        else if (error.type === "peer-unavailable") {

            status.textContent =
                "❌ کامپیوتر دوربین پیدا نشد.";

        }

        else if (error.type === "network") {

            status.textContent =
                "❌ مشکل شبکه وجود دارد.";

        }

        else {

            status.textContent =
                "❌ خطای اتصال: " +
                error.type;

        }

    });


    // ==========================================
    // قطع شدن اتصال Peer
    // ==========================================

    peer.on("disconnected", function () {

        console.log(
            "Peer disconnected"
        );

        status.textContent =
            "🟠 اتصال به سرویس قطع شد.";

    });

</script>

</body>
</html>
